name: Remotion MP4 smoke test

on:
  pull_request:
    paths:
      - ".github/workflows/remotion-smoke.yml"
      - "remotion-actions-demo/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-smoke:
    name: Render and verify a sample MP4
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: remotion-actions-demo

    steps:
      - name: Check out the demo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remotion-actions-demo
          sparse-checkout-cone-mode: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Install Remotion Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Check Remotion composition registration
        run: npm run compositions

      - name: Render a video
        run: npm run render

      - name: Verify MP4 codec, dimensions and duration
        run: npm run verify

      - name: Upload the video and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-smoke-mp4
          path: |
            remotion-actions-demo/out/remotion-smoke.mp4
            remotion-actions-demo/out/smoke-report.json
          if-no-files-found: warn
          retention-days: 7

name: Crusher Evo vertical product video

on:
  pull_request:
    paths:
      - ".github/workflows/crusher-evo-ad.yml"
      - "remotion-actions-demo/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-ad:
    name: Render Crusher Evo vertical product ad
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    defaults:
      run:
        working-directory: remotion-actions-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            remotion-actions-demo
          sparse-checkout-cone-mode: true

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2
          python3 -m pip install --break-system-packages 'Pillow>=10,<13'

      - name: Install Remotion
        run: npm install --no-audit --no-fund

      - name: Download and prepare authentic product photography
        run: npm run assets:crusher

      - name: Generate original electronic instrumental
        run: npm run audio:crusher

      - name: TypeScript test
        run: npm run typecheck

      - name: Install Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render 1080x1920 video
        run: npm run render:crusher

      - name: Verify MP4, audio and 16-second duration
        run: npm run verify:crusher

      - name: Upload video, report and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crusher-evo-vertical-video
          path: |
            remotion-actions-demo/out/crusher-evo-vertical.mp4
            remotion-actions-demo/out/crusher-verification.json
            remotion-actions-demo/out/crusher-asset-sources.json
          if-no-files-found: warn
          retention-days: 7
